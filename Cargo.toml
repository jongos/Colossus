[package]
name = "colossus-audit"
version = "0.4.0"
edition = "2021"
description = "Read-only, evidence-first developer workspace auditor"
publish = false

[[bin]]
name = "colossus"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha1 = "0.10"
semver = "1"
ctrlc = "3"
toml = { version = "0.8", default-features = false, features = ["parse"] }

[profile.release]
strip = true
